    <rect x="388" y="176" width="30" height="160" rx="10" fill="#FFFFFF" opacity="0.92"/>
    <rect x="226" y="248" width="10" height="16" rx="3" fill="#1B5E20" opacity="0.55"/>
    <rect x="251" y="248" width="10" height="16" rx="3" fill="#1B5E20" opacity="0.55"/>
    <rect x="276" y="248" width="10" height="16" rx="3" fill="#1B5E20" opacity="0.55"/>
  </g>

  <!-- wordmark, right side -->
  <text x="560" y="260" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="700" fill="#FFFFFF">Gym Apk</text>
  <text x="562" y="306" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#E8F5E9" opacity="0.92">Tu rutina de gym, 100% offline</text>
