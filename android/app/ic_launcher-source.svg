<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8F5E9"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g>
    <!-- barbell bar -->
    <rect x="120" y="236" width="272" height="40" rx="20" fill="url(#bar)"/>

    <!-- left plates -->
    <rect x="46" y="146" width="46" height="220" rx="14" fill="#FFFFFF"/>
    <rect x="94" y="176" width="30" height="160" rx="10" fill="#FFFFFF" opacity="0.92"/>

    <!-- right plates -->
    <rect x="420" y="146" width="46" height="220" rx="14" fill="#FFFFFF"/>
    <rect x="388" y="176" width="30" height="160" rx="10" fill="#FFFFFF" opacity="0.92"/>

    <!-- grip texture on bar -->
    <rect x="226" y="248" width="10" height="16" rx="3" fill="#1B5E20" opacity="0.55"/>
    <rect x="251" y="248" width="10" height="16" rx="3" fill="#1B5E20" opacity="0.55"/>
    <rect x="276" y="248" width="10" height="16" rx="3" fill="#1B5E20" opacity="0.55"/>
  </g>
</svg>
